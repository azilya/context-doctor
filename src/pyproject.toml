[project]
name = "context-doctor"
version = "0.1.0"
description = ""
authors = [
    { name = "Context Doctor Demo Maintainers" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "openai (>=2.1.0,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "fastapi (>=0.119.1,<0.122.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Make the local package installable by poetry. Point the package discovery to
# the `context_doctor` package directory so `import context_doctor` works after
# `poetry install`.
packages = [{ include = "context_doctor" }]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-fastapi>=0.1.0",
    "ruff>=0.15.15",
]
