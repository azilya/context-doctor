[project]
name = "context-doctor"
version = "0.1.0"
description = "A FastAPI demo for inspecting text-to-SQL rule context."
authors = [{ name = "Ilya Azerkovich" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "openai (>=2.1.0,<3.0.0)",
    "fastapi (>=0.119.1,<0.122.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "requests (>=2.32.0,<3.0.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv]

[tool.uv.build-backend]
module-name = ["context_doctor"]
module-root = "src"

[dependency-groups]
dev = [
    "playwright>=1.58.0,<2.0.0",
    "pytest>=9.0.3",
    "pytest-env>=1.6.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.15",
    "watchfiles>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--capture=no"]
